name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://gym_platform:gym_platform_test_password@localhost:55432/gym_platform_test?schema=public
  DATABASE_URL_TEST: postgresql://gym_platform:gym_platform_test_password@localhost:55432/gym_platform_test?schema=public
  REDIS_URL: redis://localhost:6379
  RATE_LIMIT_STORE: redis
  REDIS_CONNECT_TIMEOUT_MS: "2000"
  REDIS_HEALTH_TIMEOUT_MS: "1000"
  REDIS_MAX_RECONNECT_ATTEMPTS: "3"
  TRUSTED_PROXIES: ""
  CORS_ORIGINS: http://localhost:3000
  SWAGGER_ENABLED: "false"
  RATE_LIMIT_MAX: "1000"
  AUTH_ADAPTER: temporary-header
  ALLOW_TEST_DATABASE_RESET: "true"
  ADMIN_AUTH_ADAPTER: supabase-jwt
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: PostgreSQL, Redis and RLS
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym_platform
          POSTGRES_PASSWORD: gym_platform_test_password
          POSTGRES_DB: gym_platform_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gym_platform -d gym_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations and run integration tests
        run: pnpm test:integration

      - name: Run RLS spike
        run: pnpm test:rls-spike

  docker:
    name: Production images
    runs-on: ubuntu-latest
    needs:
      - quality
      - integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t gym-platform-api:ci .

      - name: Build admin web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          -f apps/admin-web/Dockerfile
          -t gym-platform-admin-web:ci
          .

      - name: Build workers image
        run: docker build -f apps/workers/Dockerfile -t gym-platform-workers:ci .
